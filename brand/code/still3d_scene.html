<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ASTRIS 3D Badge</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{"imports": {"three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
// A single 3D badge of the logo on a transparent background: ?style=pearl (hero 2) or ?style=gold (ident 04).
import * as THREE from 'three';
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 2000), H = +(Q.get('h') || 2000);
const STYLE = Q.get('style') || 'pearl';
const GEO = await (await fetch('/hero2_geometry.json')).json();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

function makeEnv(gold) {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(20, 64, 32), new THREE.ShaderMaterial({ side: THREE.BackSide,
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: gold
      ? 'varying vec3 vP; void main(){ float y = vP.y; vec3 c = mix(vec3(0.22,0.14,0.07), vec3(0.05,0.03,0.02), smoothstep(0.0,1.0,y)); c = mix(c, vec3(0.02,0.04,0.05), smoothstep(0.0,-0.6,y)); gl_FragColor = vec4(c,1.0); }'
      : 'varying vec3 vP; void main(){ float y = vP.y; vec3 c = mix(vec3(0.10,0.05,0.2), vec3(0.42,0.34,0.78), smoothstep(0.0,0.95,y)); c = mix(c, vec3(0.02,0.01,0.05), smoothstep(0.0,-0.7,y)); c += vec3(0.35,0.12,0.55) * pow(max(0.0,-vP.z),3.0) * 0.6; gl_FragColor = vec4(c,1.0); }' })));
  const panel = (w, h, pos, col, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide })); m.position.copy(pos); m.lookAt(0, 0, 0); env.add(m); };
  panel(9, 3.2, new THREE.Vector3(0, 7, 6), gold ? 0xffdcae : 0xffffff, 5.0);
  panel(5, 5, new THREE.Vector3(-1.5, 1.5, 12), gold ? 0xffe9cc : 0xfff6ff, 2.0);
  panel(2.2, 9, new THREE.Vector3(-9, 0.5, 2), gold ? 0xffbf7a : 0xffd6f2, 4.0);
  panel(2.2, 9, new THREE.Vector3(9, 0.5, 2), gold ? 0x7fe8e0 : 0xcfe0ff, gold ? 2.2 : 3.0);
  panel(10, 2.5, new THREE.Vector3(0, 1.0, -10), gold ? 0xffc477 : 0xa060ff, 5.0);
  for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2; panel(0.6, 7, new THREE.Vector3(Math.cos(a) * 11, k % 2 ? 2.5 : -1.5, Math.sin(a) * 11), 0xffffff, 5.0); }
  return new THREE.PMREMGenerator(renderer).fromScene(env, 0.015).texture;
}
const gold = STYLE === 'gold';
scene.environment = makeEnv(gold);
const mat = gold
  ? new THREE.MeshPhysicalMaterial({ color: 0xf2cf96, metalness: 1.0, roughness: 0.18, clearcoat: 0.5, envMapIntensity: 1.4 })
  : new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0.25, roughness: 0.12, clearcoat: 1.0, clearcoatRoughness: 0.03,
      iridescence: 1.0, iridescenceIOR: 2.0, iridescenceThicknessRange: [250, 1150], envMapIntensity: 1.9, sheen: 0.6, sheenColor: new THREE.Color(0xffd6f6) });
const toShape = o => { const s = new THREE.Shape(o.outer.map(p => new THREE.Vector2(p[0], p[1])));
  for (const h of o.holes) s.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1])))); return s; };
const logo = new THREE.Group();
for (const p of GEO.pieces) {
  const g = new THREE.ExtrudeGeometry(toShape(p), { depth: 0.16, bevelEnabled: true, bevelThickness: 0.014, bevelSize: 0.014,
    bevelOffset: -0.014, bevelSegments: 6, curveSegments: 1 });
  g.translate(0, 0, -0.17);
  logo.add(new THREE.Mesh(g, mat));
}
logo.rotation.set(-0.16, 0.30, 0.0);
scene.add(logo);
const key = new THREE.DirectionalLight(gold ? 0xffdcb0 : 0xffffff, gold ? 2.2 : 3.2); key.position.set(-2.5, 3.5, 4);
const rim = new THREE.DirectionalLight(gold ? 0x6fe6ff : 0xb070ff, 2.5); rim.position.set(3, 1, -3);
scene.add(key, rim, new THREE.AmbientLight(gold ? 0x2a2018 : 0x40306a, 0.6));
const camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 50);
camera.position.set(0, 0, 4.2); camera.lookAt(0, 0, 0); camera.updateMatrixWorld(true);

const gl = renderer.getContext();
const buf = new Uint8Array(W * H * 4);
window.renderFrame = async () => {
  renderer.render(scene, camera);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  await fetch('/frame', { method: 'POST', body: buf });
  return {};
};
window.READY = true;
</script>
</body>
</html>
