<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ASTRIS Fly-Through</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{"imports": {"three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
// ASTRIS PRODUCTIONS - ident 04 "The Slow Fly-Through". Pure function of t: renderFrame(f) -> t = f / 24.
// Giant champagne-gold letters (Playfair Display Black) and the logo float in a midnight-teal void. The camera
// glides behind the letters, threads the gap between R and I, skims T-S-A, rises past the logo, then pulls back.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 3840), H = +(Q.get('h') || 2160), FPS = 24;
const GEO = await (await fetch('/ident04_geometry.json')).json();
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = x => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10); };
const ease = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(404);

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

// ---------- the void: deep teal dome with a warm horizon glow ----------
const dome = new THREE.Mesh(new THREE.SphereGeometry(60, 64, 32), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `varying vec3 vP; void main(){
    float y = vP.y;
    vec3 c = mix(vec3(0.012, 0.045, 0.055), vec3(0.004, 0.012, 0.018), smoothstep(-0.2, 0.8, y));
    c += vec3(0.11, 0.06, 0.02) * exp(-pow((y + 0.05) / 0.18, 2.0)) * 0.6;
    gl_FragColor = vec4(c, 1.0); }`
}));
scene.add(dome);

// ---------- studio environment for the reflections: warm softboxes, a teal sky ----------
function makeEnv() {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(20, 64, 32), new THREE.ShaderMaterial({
    side: THREE.BackSide,
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `varying vec3 vP; void main(){ float y = vP.y;
      vec3 c = mix(vec3(0.20, 0.13, 0.07), vec3(0.06, 0.04, 0.025), smoothstep(0.0, 1.0, y));
      c = mix(c, vec3(0.025, 0.018, 0.012), smoothstep(0.0, -0.6, y));
      gl_FragColor = vec4(c, 1.0); }` })));
  const panel = (w, h, pos, col, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.copy(pos); m.lookAt(0, 0, 0); env.add(m);
  };
  panel(10, 3, new THREE.Vector3(-3, 7, 6), 0xffdcae, 6.0);
  panel(4, 9, new THREE.Vector3(-10, 1, 1), 0xffbf7a, 4.5);
  panel(1.6, 9, new THREE.Vector3(10, 0, -2), 0x7fe8e0, 2.2);
  panel(6, 6, new THREE.Vector3(1, 1, 12), 0xffe9cc, 2.4);
  for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; panel(0.5, 6, new THREE.Vector3(Math.cos(a) * 12, 3, Math.sin(a) * 12), 0xfff1dc, 4.0); }
  return new THREE.PMREMGenerator(renderer).fromScene(env, 0.02).texture;
}
scene.environment = makeEnv();

const gold = new THREE.MeshPhysicalMaterial({ color: 0xf2cf96, metalness: 1.0, roughness: 0.17, clearcoat: 0.5,
  clearcoatRoughness: 0.08, envMapIntensity: 1.35 });

const toShape = o => { const s = new THREE.Shape(o.outer.map(p => new THREE.Vector2(p[0], p[1])));
  for (const h of o.holes) s.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1])))); return s; };
function extrude(shape, depth, bevel) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel,
    bevelOffset: -bevel, bevelSegments: 5, curveSegments: 1 });
  g.translate(0, 0, -(depth + bevel));
  return g;
}
for (const p of GEO.pieces) scene.add(new THREE.Mesh(extrude(toShape(p), 0.14, 0.011), gold));
const letterBoxes = [];
for (const L of GEO.text.astris) {
  for (const p of L.polys) scene.add(new THREE.Mesh(extrude(toShape(p), 0.17, 0.012), gold));
  letterBoxes.push(L.bbox);
}
for (const L of GEO.text.prod) for (const p of L.polys) scene.add(new THREE.Mesh(extrude(toShape(p), 0.03, 0.003), gold));

// ---------- dust motes drifting through the light ----------
const motes = [];
const moteMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffc477).multiplyScalar(2.0) });
const moteGeo = new THREE.SphereGeometry(1, 10, 6);
for (let i = 0; i < 380; i++) {
  const m = new THREE.Mesh(moteGeo, moteMat);
  const s = { m, p: new THREE.Vector3(lerp(-2.2, 2.2, rand()), lerp(-1.6, 1.0, rand()), lerp(-1.2, 1.4, rand())),
              v: new THREE.Vector3((rand() - 0.5) * 0.02, 0.006 + rand() * 0.012, (rand() - 0.5) * 0.02),
              r: 0.0022 + rand() * 0.006, ph: rand() * 6.28 };
  m.scale.setScalar(s.r);
  scene.add(m); motes.push(s);
}

// ---------- lights ----------
const key = new THREE.DirectionalLight(0xffdcb0, 2.6); key.position.set(-3, 4, 3);
const rim = new THREE.DirectionalLight(0x6fe6ff, 2.2); rim.position.set(3, 1, -4);
const fill = new THREE.AmbientLight(0x1d3a40, 0.6);
scene.add(key, rim, fill);

// ---------- the camera path ----------
const camera = new THREE.PerspectiveCamera(52, W / H, 0.004, 120);
const B = letterBoxes;
const ym = B[0][1] + (B[0][3] - B[0][1]) * 0.52;
const gapRI = (B[3][2] + B[4][0]) / 2, xT = (B[2][0] + B[2][2]) / 2, xS = (B[1][0] + B[1][2]) / 2, xA = (B[0][0] + B[0][2]) / 2;
const xEnd = B[5][2];
const pathA = new THREE.CatmullRomCurve3([
  new THREE.Vector3(xEnd + 0.42, ym + 0.03, -0.42),
  new THREE.Vector3(xEnd - 0.05, ym + 0.01, -0.30),
  new THREE.Vector3(gapRI + 0.04, ym, -0.12),
  new THREE.Vector3(gapRI - 0.02, ym, 0.10),
  new THREE.Vector3(xT, ym + 0.02, 0.26),
  new THREE.Vector3(xS, ym + 0.08, 0.30),
  new THREE.Vector3(xA + 0.1, ym + 0.36, 0.40),
  new THREE.Vector3(-0.18, -0.08, 0.62),
], false, 'centripetal');
const lookA = new THREE.CatmullRomCurve3([
  new THREE.Vector3(xEnd - 0.5, ym, -0.05),
  new THREE.Vector3(gapRI + 0.1, ym, -0.02),
  new THREE.Vector3(gapRI - 0.2, ym, 0.02),
  new THREE.Vector3(xT - 0.1, ym, 0.0),
  new THREE.Vector3(xS - 0.1, ym + 0.02, 0.0),
  new THREE.Vector3(xA, ym + 0.2, 0.0),
  new THREE.Vector3(-0.05, 0.0, 0.0),
  new THREE.Vector3(0.0, 0.0, 0.0),
], false, 'centripetal');
const FINAL = { pos: new THREE.Vector3(0, -0.33, 5.3), target: new THREE.Vector3(0, -0.33, 0), fov: 30 };
const TA = 5.4, TB0 = 5.1, TB1 = 7.9;

function cameraAt(t) {
  const ua = ease(t / TA) * 0.999;
  const pa = pathA.getPoint(ua), la = lookA.getPoint(ua);     // same parameter: control points stay in step
  const kb = smooth((t - TB0) / (TB1 - TB0));
  camera.position.copy(pa.clone().lerp(FINAL.pos, kb));
  const tgt = la.clone().lerp(FINAL.target, kb);
  camera.up.set(Math.sin(0.06 * Math.sin(t * 0.6) * (1 - kb)), 1, 0).normalize();
  camera.lookAt(tgt);
  camera.fov = lerp(52, FINAL.fov, kb);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return { tgt, kb };
}

// ---------- depth of field, rendered through a multisampled target so edges stay clean ----------
const rt = new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(1);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 0.3, aperture: 0.002, maxblur: 0.012 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());

function update(t) {
  const { tgt, kb } = cameraAt(t);
  for (const s of motes) {
    const p = s.p.clone().addScaledVector(s.v, t);
    p.x += 0.01 * Math.sin(t * 0.7 + s.ph); p.y += 0.008 * Math.cos(t * 0.5 + s.ph);
    s.m.position.copy(p);
    s.m.scale.setScalar(s.r * (1 - 0.6 * kb));
  }
  key.intensity = lerp(2.6, 2.2, kb);
  bokeh.uniforms.focus.value = camera.position.distanceTo(tgt);
  bokeh.uniforms.aperture.value = lerp(0.0028, 0.0, smooth((t - TB0 - 0.6) / 1.8));
  bokeh.uniforms.maxblur.value = lerp(0.012, 0.0, smooth((t - TB0 - 0.6) / 1.8));
  return { kb };
}

const gl = renderer.getContext();
const buf = new Uint8Array(W * H * 4);
window.renderFrame = async (f) => {
  const info = update(f / FPS);
  composer.render();
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  await fetch('/frame', { method: 'POST', body: buf });
  return info;
};
window.READY = true;
</script>
</body>
</html>
