<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astris Prototype Three</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap">
<style>
/* Layout concept: a showreel that never stops, a bare menu rail on the left, and every page laid over the reel like a slate. */
:root {
  --bg: #0b0a09; --ink: #f2ebdd; --dim: rgba(242, 235, 221, .72); --faint: rgba(242, 235, 221, .42);
  --y: #f2b705; --k: #141210; --line: rgba(242, 235, 221, .2);
  --display: "Anton", Impact, "Arial Narrow", sans-serif; --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --rail: 210px; --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.55; overflow: hidden; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.a { font-family: var(--display); font-weight: 400; letter-spacing: .012em; }
.cap { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 500; }
:focus-visible { outline: 3px solid var(--y); outline-offset: 3px; }

/* ---- the reel: always playing, silent, on loop ---- */
#reel { position: fixed; inset: 0; z-index: 0; background: #050504; overflow: hidden; }
#reel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s; }
#reel.has-video video { opacity: 1; }
#reel.has-video .slides { opacity: 0; }
.slides { position: absolute; inset: 0; transition: opacity 1s; }
.slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.6s ease; transform: scale(1.02); }
.slide.on { opacity: 1; animation: drift 14s linear forwards; }
@keyframes drift { from { transform: scale(1.02) translate3d(0, 0, 0); } to { transform: scale(1.16) translate3d(-1.5%, -1%, 0); } }
#scrim { position: absolute; inset: 0; background:
  linear-gradient(90deg, rgba(11, 10, 9, .82) 0, rgba(11, 10, 9, .5) 38%, rgba(11, 10, 9, .12) 70%, rgba(11, 10, 9, .3)),
  linear-gradient(0deg, rgba(11, 10, 9, .85) 0, rgba(11, 10, 9, 0) 42%),
  linear-gradient(180deg, rgba(11, 10, 9, .5) 0, rgba(11, 10, 9, 0) 20%); }

/* ---- the menu rail ---- */
#rail { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: var(--rail); padding: 30px 0 30px 34px; display: flex; flex-direction: column; justify-content: space-between; }
.logo-link { display: flex; align-items: center; gap: 12px; color: var(--y); width: max-content; }
.logo-link b { font-family: var(--display); font-weight: 400; font-size: 25px; letter-spacing: .04em; color: var(--ink); }
.logo { display: block; height: 30px; width: auto; }
#nav { display: flex; flex-direction: column; gap: 4px; }
#nav a { font-size: 12.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; padding: 9px 0; color: var(--dim); display: flex; align-items: center; gap: 10px; transition: color .25s, transform .35s var(--ease); text-shadow: 0 1px 12px rgba(0, 0, 0, .7); }
#nav a::before { content: ""; width: 0; height: 2px; background: var(--y); transition: width .35s var(--ease); }
#nav a:hover { color: var(--ink); transform: translateX(4px); }
#nav a[aria-current="page"] { color: var(--y); }
#nav a[aria-current="page"]::before, #nav a:hover::before { width: 22px; }
.rail-foot { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); line-height: 1.9; }
#burger { display: none; }

/* ---- the page layer ---- */
#view { position: fixed; inset: 0; z-index: 10; overflow-y: auto; overflow-x: hidden; padding: 0; scrollbar-width: thin; scrollbar-color: var(--y) transparent; }
body:not([data-page="home"]) #view { background: linear-gradient(90deg, rgba(11, 10, 9, .93) 0, rgba(11, 10, 9, .86) 45%, rgba(11, 10, 9, .8)); backdrop-filter: blur(18px) saturate(.8); }
body[data-page="home"] #view { padding: 0; }
.rise { animation: rise .8s var(--ease) both; animation-delay: var(--d, 0ms); }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

/* ---- transition: a slanted strip of yellow wipes across ---- */

/* ---- home: a quiet first screen over the reel, then more as you scroll ---- */
.hs { position: relative; height: 100vh; min-height: 560px; }
@keyframes blink { 50% { opacity: .15; } }
body[data-page="home"] .rail-foot { opacity: 0; pointer-events: none; }
.blk { position: relative; padding: 100px 56px 100px calc(var(--rail) + 40px); background: rgba(11, 10, 9, .8); backdrop-filter: blur(14px) saturate(.8); }
.blk.first { background: linear-gradient(180deg, rgba(11, 10, 9, 0) 0, rgba(11, 10, 9, .82) 200px); backdrop-filter: none; padding-top: 140px; }
.blk h2 { font-size: clamp(44px, 5.4vw, 86px); line-height: .95; margin-bottom: 8px; } .blk h2 i { color: var(--y); font-style: normal; } .blk .lead { color: var(--dim); max-width: 520px; margin-bottom: 34px; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.card { display: block; transition: transform .4s var(--ease); } .card:hover { transform: translateY(-8px); }
.card .im { aspect-ratio: 4 / 5; background-size: cover; background-position: center; border: 3px solid #000; position: relative; transition: outline-offset .3s; outline: 0 solid var(--y); } .card:hover .im { outline: 4px solid var(--y); outline-offset: 4px; }
.card .im span { position: absolute; left: 0; top: 0; background: var(--y); color: var(--k); font-size: 10.5px; letter-spacing: .18em; font-weight: 700; text-transform: uppercase; padding: 5px 12px; }
.card b { display: block; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; margin-top: 12px; } .card small { color: var(--dim); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.bio { display: grid; grid-template-columns: 340px 1fr; gap: 56px; align-items: center; }
.bio .me { width: 340px; justify-self: start; animation: none; }
.bio p { color: var(--dim); max-width: 560px; margin-bottom: 14px; font-size: 16px; }
/* ---- the opening: the A's film strip scrolls the latest work ---- */
/* ---- tabs, studio ---- */
.tabs { display: flex; gap: 8px; margin: -4px 0 26px; flex-wrap: wrap; } .tab { font-family: var(--display); font-size: 30px; letter-spacing: .02em; padding: 6px 22px 8px 0; margin-right: 16px; color: var(--faint); border-bottom: 3px solid transparent; transition: color .2s, border-color .2s; } .tab:hover { color: var(--ink); } .tab[aria-pressed="true"] { color: var(--y); border-color: var(--y); }
.drop { display: grid; place-items: center; text-align: center; gap: 6px; min-height: 150px; border: 3px dashed rgba(242, 183, 5, .7); background: rgba(242, 183, 5, .05); cursor: pointer; color: var(--dim); transition: background .25s; } .drop:hover { background: rgba(242, 183, 5, .12); } .drop b { font-size: 36px; color: var(--y); font-weight: 400; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; } .sc { border: 1px solid var(--line); background: rgba(20, 18, 16, .7); } .sc .im { aspect-ratio: 4 / 3; background-size: cover; background-position: center; } .sc .bd { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; } .sc b { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1; } .sc small { color: var(--dim); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.sw { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); } .sw i { width: 42px; height: 24px; border-radius: 14px; background: rgba(242, 235, 221, .2); position: relative; transition: background .25s; flex: none; } .sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); transition: transform .3s var(--ease), background .25s; } .sw[aria-pressed="true"] { color: var(--y); } .sw[aria-pressed="true"] i { background: var(--y); } .sw[aria-pressed="true"] i::after { transform: translateX(18px); background: var(--k); }
/* ---- the film-reel wipe between pages ---- */
/* ---- home: a centred title over the reel, then more as you scroll ---- */
.hs { position: relative; height: 100vh; min-height: 560px; }
.hs::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 55% 46% at 50% 50%, rgba(11, 10, 9, .66), transparent 72%); pointer-events: none; }
.hero { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-56%); text-align: center; padding: 0 24px; }
.hero h1 { font-size: clamp(76px, 12vw, 200px); line-height: .88; text-shadow: 0 6px 44px rgba(0, 0, 0, .65); }
.hero .prod { font-size: clamp(18px, 2.4vw, 38px); letter-spacing: .52em; padding-left: .52em; margin-top: 16px; color: var(--y); text-shadow: 0 2px 20px rgba(0, 0, 0, .9); }
.hero .go { display: flex; justify-content: center; margin-top: 36px; }
.scue { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; text-shadow: 0 1px 12px #000; }
.scue::after { content: ""; width: 1px; height: 40px; background: var(--y); transform-origin: top; animation: cue 1.8s ease-in-out infinite; }
@keyframes cue { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; border-radius: 40px; font-weight: 700; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; transition: transform .3s var(--ease), background .25s, color .25s; }
.btn.y { background: var(--y); color: var(--k); } .btn.o { border: 2px solid var(--ink); } .btn.y:hover, .btn.o:hover { transform: translateY(-3px); } .btn.o:hover { background: var(--ink); color: var(--k); }
/* ---- the footer: on every page, with the film reel at the very bottom ---- */
.pg { padding: 56px 56px 90px calc(var(--rail) + 40px); min-height: calc(100vh - 380px); }
.foot { position: relative; background: rgba(8, 7, 6, .95); border-top: 1px solid var(--line); }
.fcols { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1.2fr; gap: 36px; padding: 56px 56px 44px calc(var(--rail) + 40px); }
.foot h4 { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--y); margin-bottom: 14px; font-weight: 700; }
.foot a, .foot button, .foot p { display: block; font-size: 14px; color: var(--dim); padding: 3px 0; text-align: left; transition: color .2s; } .foot a:hover, .foot button:hover { color: var(--y); }
.foot .big { font-family: var(--display); font-size: 34px; letter-spacing: .04em; color: var(--ink); line-height: 1.1; } .foot .logo-link { display: flex; color: var(--y); margin-bottom: 14px; }
.fbase { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 16px 56px 16px calc(var(--rail) + 40px); border-top: 1px solid var(--line); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
.ribbon { position: relative; height: 150px; background: #070605; border-top: 1px solid var(--line); }
.ribbon::before, .ribbon::after { content: ""; position: absolute; left: 0; right: 0; height: 11px; background: repeating-linear-gradient(90deg, rgba(242, 235, 221, .26) 0 16px, transparent 16px 34px); z-index: 2; pointer-events: none; } .ribbon::before { top: 8px; } .ribbon::after { bottom: 8px; }
.fr { position: relative; flex: none; width: 200px; height: 84px; background-size: cover; background-position: center; border: 2px solid #000; filter: saturate(.85); transition: filter .3s, transform .3s var(--ease); user-select: none; -webkit-user-drag: none; }
.fr:hover { filter: none; transform: translateY(-3px) scale(1.04); outline: 2px solid var(--y); }
.fr span { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; text-align: center; background: linear-gradient(0deg, rgba(0, 0, 0, .85), transparent); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; }
/* ---- news post ---- */
.np h1 { font-size: clamp(48px, 7vw, 112px); line-height: .95; margin: 12px 0 26px; } .np .hi { height: min(50vh, 520px); background-size: cover; background-position: center; border: 3px solid #000; margin-bottom: 34px; }
.np .tx { max-width: 680px; display: grid; gap: 18px; color: var(--dim); font-size: 17px; line-height: 1.7; } .ng { columns: 3 240px; column-gap: 14px; margin-top: 44px; } .ng img { margin-bottom: 14px; width: 100%; cursor: zoom-in; transition: filter .3s; } .ng img:hover { filter: brightness(.75); }
.wip .im span.dn { background: var(--ink); } a.wip { color: inherit; }
/* ---- film grain over everything (a little stronger on the home screen) ---- */
#grain { position: fixed; inset: -60px; z-index: 200; pointer-events: none; opacity: .17; mix-blend-mode: overlay; animation: grain .7s steps(7) infinite;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.5 -.2'/></filter><rect width='260' height='260' filter='url(%23n)'/></svg>"); }
body[data-page="home"] #grain { opacity: .24; }
@keyframes grain { 0% { transform: translate(0, 0); } 14% { transform: translate(-31px, 17px); } 28% { transform: translate(24px, -42px); } 42% { transform: translate(-48px, -12px); } 57% { transform: translate(37px, 29px); } 71% { transform: translate(-14px, 46px); } 85% { transform: translate(44px, -27px); } 100% { transform: translate(0, 0); } }
/* ---- the footer reel: constantly rolling ---- */
.rs { height: 100%; overflow: hidden; }
.track { display: flex; gap: 12px; width: max-content; padding: 33px 0; animation: roll 90s linear infinite; }
.ribbon:hover .track { animation-play-state: paused; }
@keyframes roll { to { transform: translateX(-50%); } }
/* ---- page transitions (five, taking turns) ---- */
#tr { position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
#tr .rl { position: absolute; top: -12%; bottom: -12%; width: 40%; background: #100e0c; transform: skewX(-26.565deg); border-inline: 4px solid var(--y); overflow: hidden; }
#tr .rl::before, #tr .rl::after { content: ""; position: absolute; top: 0; bottom: 0; width: 38px; z-index: 2; background: repeating-linear-gradient(180deg, #050403 0 24px, #2c2924 24px 60px); animation: spr .5s linear infinite; }
#tr .rl::before { left: 12px; } #tr .rl::after { right: 12px; }
@keyframes spr { to { background-position-y: 60px; } }
#tr .rin { position: absolute; left: 70px; right: 70px; top: 0; animation: rup .9s linear infinite; }
@keyframes rup { to { transform: translateY(-50%); } }
#tr .rin i { display: block; height: 240px; margin: 16px 0; background-size: cover; background-position: center; border: 3px solid #000; }
#tr.reel .rl { left: -60%; animation: swl .9s cubic-bezier(.7, 0, .3, 1) both; } @keyframes swl { to { left: 140%; } }
#tr.back .rl { left: 140%; animation: swr .9s cubic-bezier(.7, 0, .3, 1) both; } @keyframes swr { to { left: -60%; } }
#tr .bar2 { position: absolute; top: -10%; bottom: -10%; width: 19%; background: var(--y); transform: skewX(-26.565deg) translateX(-130%); animation: bars .95s cubic-bezier(.65, 0, .35, 1) both; border-right: 5px solid var(--k); }
@keyframes bars { 0% { transform: skewX(-26.565deg) translateX(-130%); } 45%, 55% { transform: skewX(-26.565deg) translateX(0); } 100% { transform: skewX(-26.565deg) translateX(130%); } }
#tr .cl { position: absolute; left: -5%; right: -5%; height: 51%; background: repeating-linear-gradient(-26.565deg, #111 0 70px, var(--y) 70px 140px); border: 6px solid #000; }
#tr .cl.t { top: 0; transform: translateY(-105%); animation: clt .95s cubic-bezier(.6, 0, .2, 1) both; border-top: 0; } #tr .cl.b { bottom: 0; transform: translateY(105%); animation: clb .95s cubic-bezier(.6, 0, .2, 1) both; border-bottom: 0; }
@keyframes clt { 0% { transform: translateY(-105%); } 34%, 52% { transform: none; } 100% { transform: translateY(-105%); } } @keyframes clb { 0% { transform: translateY(105%); } 34%, 52% { transform: none; } 100% { transform: translateY(105%); } }
@property --r { syntax: "<length>"; inherits: false; initial-value: 150vmax; }
#tr .iris { position: absolute; inset: 0; background: var(--y); -webkit-mask: radial-gradient(circle at 50% 50%, transparent var(--r), #000 calc(var(--r) + 1px)); mask: radial-gradient(circle at 50% 50%, transparent var(--r), #000 calc(var(--r) + 1px)); animation: iris 1s cubic-bezier(.6, 0, .4, 1) both; }
@keyframes iris { 0% { --r: 150vmax; } 45%, 55% { --r: 0px; } 100% { --r: 150vmax; } }
/* ---- the opening: the bar slams down the A, light bursts, the strip rips past, the camera zooms in ---- */
#intro { position: fixed; inset: 0; z-index: 120; background: var(--bg); display: grid; place-items: center; transition: opacity .45s ease; overflow: hidden; }
#intro.out { opacity: 0; pointer-events: none; }
#isvg { height: min(46vh, 420px); width: auto; overflow: visible; will-change: transform; animation: pulse .5s ease-out .45s; }
@keyframes pulse { 0% { transform: scale(1); } 30% { transform: scale(1.05); } 100% { transform: scale(1); } }
#ibar { animation: slam .45s cubic-bezier(.55, 0, .95, .45) both; } @keyframes slam { from { transform: translate(-520px, -1040px); opacity: 0; } 12% { opacity: 1; } to { transform: none; opacity: 1; } }
#istrip { opacity: 0; animation: sfade .12s linear .45s forwards; } @keyframes sfade { to { opacity: 1; } }
#ibloom, #irays { transform-box: fill-box; transform-origin: center; opacity: 0; }
#ibloom { animation: bloom 1s ease-out .45s both; } @keyframes bloom { 0% { opacity: 0; transform: scale(.08); } 12% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3); } }
#irays { animation: irays 1.1s ease-out .45s both; } @keyframes irays { 0% { opacity: 0; transform: scale(.2) rotate(0); } 14% { opacity: .95; } 100% { opacity: 0; transform: scale(1) rotate(14deg); } }
#iflash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(255, 240, 190, .5), transparent 62%); opacity: 0; animation: flash .55s ease-out .45s both; pointer-events: none; } @keyframes flash { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
.skip { position: absolute; right: 26px; bottom: 22px; z-index: 3; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); } .skip:hover { color: var(--y); }
body.arrive #view, body.arrive #rail { animation: arrive 1.1s var(--ease) both; } @keyframes arrive { from { transform: scale(1.25); opacity: 0; } to { transform: none; opacity: 1; } }
/* ---- page furniture ---- */
.ph { margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: flex-end; }
.ph h1 { font-size: clamp(64px, 9vw, 150px); line-height: .92; }
.ph h1 i { color: var(--y); font-style: normal; }
.ph p { max-width: 460px; color: var(--dim); padding-bottom: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: center; margin-bottom: 30px; padding: 14px 0; border-block: 1px solid var(--line); }
.bar .grp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar label, .bar .lab { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); margin-right: 6px; }
.chip { padding: 9px 18px; border: 1px solid var(--line); border-radius: 30px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 500; transition: background .25s, color .25s, border-color .25s, transform .3s var(--ease); }
.chip:hover { border-color: var(--ink); transform: translateY(-2px); }
.chip[aria-pressed="true"] { background: var(--y); color: var(--k); border-color: var(--y); font-weight: 700; }
select { appearance: none; background: rgba(242, 235, 221, .08) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23f2b705' stroke-width='2'/></svg>") no-repeat right 14px center; color: var(--ink); border: 1px solid var(--line); border-radius: 30px; padding: 9px 38px 9px 18px; font: 500 12px var(--text); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
select option { background: #1b1916; color: var(--ink); }
.count { margin-left: auto; font-size: 12px; letter-spacing: .18em; color: var(--faint); text-transform: uppercase; font-variant-numeric: tabular-nums; }
.note { margin-top: 56px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); max-width: 640px; line-height: 1.9; }

/* ---- films: list ---- */
.row { display: grid; grid-template-columns: 70px 1fr 150px 90px 110px; align-items: center; gap: 12px; min-height: 96px; padding: 0 18px; border-top: 1px solid var(--line); transition: background .3s, color .3s, padding .4s var(--ease); }
.row:last-child { border-bottom: 1px solid var(--line); }
.row .n { font-size: 12px; letter-spacing: .2em; color: var(--y); font-variant-numeric: tabular-nums; }
.row .t { font-size: clamp(34px, 4.6vw, 70px); line-height: 1; }
.row .m { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.row:hover { background: var(--y); color: var(--k); padding-left: 34px; } .row:hover .n, .row:hover .m { color: var(--k); }
#float { position: fixed; z-index: 40; width: 230px; height: 150px; background-size: cover; background-position: center; border: 4px solid var(--y); pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(.85) rotate(-3deg); transition: opacity .2s, transform .25s var(--ease); left: 0; top: 0; }
#float.on { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(2deg); }
/* ---- films: strip ---- */
