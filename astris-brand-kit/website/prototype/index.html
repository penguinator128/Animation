<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astris Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap">
<style>
/* Layout concept: a showreel that never stops, a bare menu rail on the left, and every page laid over the reel like a slate. */
:root {
  --bg: #0b0a09; --ink: #f2ebdd; --dim: rgba(242, 235, 221, .72); --faint: rgba(242, 235, 221, .42);
  --y: #f2b705; --k: #141210; --line: rgba(242, 235, 221, .2);
  --display: "Anton", Impact, "Arial Narrow", sans-serif; --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --rail: 210px; --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 15px; line-height: 1.55; overflow: hidden; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.a { font-family: var(--display); font-weight: 400; letter-spacing: .012em; }
.cap { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 500; }
:focus-visible { outline: 3px solid var(--y); outline-offset: 3px; }

/* ---- the reel: always playing, silent, on loop ---- */
#reel { position: fixed; inset: 0; z-index: 0; background: #050504; overflow: hidden; }
#reel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s; }
#reel.has-video video { opacity: 1; }
#reel.has-video .slides { opacity: 0; }
.slides { position: absolute; inset: 0; transition: opacity 1s; }
.slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.6s ease; transform: scale(1.02); }
.slide.on { opacity: 1; animation: drift 14s linear forwards; }
@keyframes drift { from { transform: scale(1.02) translate3d(0, 0, 0); } to { transform: scale(1.16) translate3d(-1.5%, -1%, 0); } }
#scrim { position: absolute; inset: 0; background:
  linear-gradient(90deg, rgba(11, 10, 9, .82) 0, rgba(11, 10, 9, .5) 38%, rgba(11, 10, 9, .12) 70%, rgba(11, 10, 9, .3)),
  linear-gradient(0deg, rgba(11, 10, 9, .85) 0, rgba(11, 10, 9, 0) 42%),
  linear-gradient(180deg, rgba(11, 10, 9, .5) 0, rgba(11, 10, 9, 0) 20%); }

/* ---- the menu rail ---- */
#rail { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: var(--rail); padding: 30px 0 30px 34px; display: flex; flex-direction: column; justify-content: space-between; }
.logo-link { display: flex; align-items: center; gap: 12px; color: var(--y); width: max-content; }
.logo-link b { font-family: var(--display); font-weight: 400; font-size: 25px; letter-spacing: .04em; color: var(--ink); }
.logo { display: block; height: 30px; width: auto; }
#nav { display: flex; flex-direction: column; gap: 4px; }
#nav a { font-size: 12.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; padding: 9px 0; color: var(--dim); display: flex; align-items: center; gap: 10px; transition: color .25s, transform .35s var(--ease); text-shadow: 0 1px 12px rgba(0, 0, 0, .7); }
#nav a::before { content: ""; width: 0; height: 2px; background: var(--y); transition: width .35s var(--ease); }
#nav a:hover { color: var(--ink); transform: translateX(4px); }
#nav a[aria-current="page"] { color: var(--y); }
#nav a[aria-current="page"]::before, #nav a:hover::before { width: 22px; }
.rail-foot { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); line-height: 1.9; }
#burger { display: none; }

/* ---- the page layer ---- */
#view { position: fixed; inset: 0; z-index: 10; overflow-y: auto; overflow-x: hidden; padding: 56px 56px 120px calc(var(--rail) + 40px); scrollbar-width: thin; scrollbar-color: var(--y) transparent; }
body:not([data-page="home"]) #view { background: linear-gradient(90deg, rgba(11, 10, 9, .93) 0, rgba(11, 10, 9, .86) 45%, rgba(11, 10, 9, .8)); backdrop-filter: blur(18px) saturate(.8); }
body[data-page="home"] #view { overflow: hidden; padding: 0; pointer-events: none; }
body[data-page="home"] #view > * { pointer-events: auto; }
.rise { animation: rise .8s var(--ease) both; animation-delay: var(--d, 0ms); }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

/* ---- transition: a slanted strip of yellow wipes across ---- */
#tape { position: fixed; z-index: 60; top: -10%; bottom: -10%; left: -60%; width: 60%; background: var(--y); transform: skewX(-26.565deg); pointer-events: none; opacity: 0; }
#tape.go { animation: tape .85s cubic-bezier(.7, 0, .3, 1); }
@keyframes tape { 0% { left: -70%; opacity: 1; } 100% { left: 130%; opacity: 1; } }

/* ---- home ---- */
.home { position: absolute; inset: 0; }
.hero { position: absolute; left: calc(var(--rail) + 40px); bottom: 150px; max-width: calc(100% - var(--rail) - 80px); }
.hero .eyebrow { color: var(--ink); text-shadow: 0 2px 16px rgba(0, 0, 0, .8); margin-bottom: 6px; }
.hero h1 { font-size: clamp(96px, 17vw, 300px); line-height: .86; text-shadow: 0 8px 50px rgba(0, 0, 0, .55); }
.slab { display: inline-block; background: var(--y); color: var(--k); transform: skewX(-26.565deg); padding: .02em .5em .02em .42em; margin: 12px 0 0 6px; }
.slab span { display: block; transform: skewX(26.565deg); font-size: clamp(34px, 5.4vw, 92px); line-height: 1.08; }
.hero .sub { margin-top: 22px; font-size: 17px; font-weight: 500; text-shadow: 0 2px 18px rgba(0, 0, 0, .9); max-width: 520px; }
.hero .go { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; border-radius: 40px; font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; transition: transform .3s var(--ease), background .25s, color .25s; }
.btn.y { background: var(--y); color: var(--k); } .btn.o { border: 2px solid var(--ink); } .btn.y:hover, .btn.o:hover { transform: translateY(-3px); } .btn.o:hover { background: var(--ink); color: var(--k); }
.slate { position: absolute; right: 40px; bottom: 126px; width: 290px; border: 2px solid var(--y); background: rgba(11, 10, 9, .72); backdrop-filter: blur(8px); padding: 14px 16px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; line-height: 2; }
.slate .tc { font-family: var(--text); font-size: 28px; font-weight: 700; letter-spacing: .06em; color: var(--ink); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 12px; }
.slate .rec { width: 12px; height: 12px; border-radius: 50%; background: #e5372c; animation: blink 1.4s steps(2) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.slate small { display: block; color: var(--dim); font-size: 11px; }
.ribbon { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: rgba(8, 7, 6, .9); border-top: 1px solid var(--line); overflow: hidden; }
.ribbon::before, .ribbon::after { content: ""; position: absolute; left: 0; right: 0; height: 9px; background: repeating-linear-gradient(90deg, rgba(242, 235, 221, .22) 0 14px, transparent 14px 30px); z-index: 2; }
.ribbon::before { top: 7px; } .ribbon::after { bottom: 7px; }
.track { display: flex; gap: 10px; width: max-content; padding: 20px 0; animation: roll 70s linear infinite; }
.ribbon:hover .track { animation-play-state: paused; }
@keyframes roll { to { transform: translateX(-50%); } }
.fr { position: relative; flex: none; width: 120px; height: 52px; background-size: cover; background-position: center; border: 2px solid #000; filter: saturate(.85); transition: filter .3s, transform .3s var(--ease); }
.fr:hover { filter: none; transform: translateY(-3px) scale(1.06); outline: 2px solid var(--y); }

/* ---- page furniture ---- */
.ph { margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: flex-end; }
.ph h1 { font-size: clamp(64px, 9vw, 150px); line-height: .92; }
.ph h1 i { color: var(--y); font-style: normal; }
.ph p { max-width: 460px; color: var(--dim); padding-bottom: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: center; margin-bottom: 30px; padding: 14px 0; border-block: 1px solid var(--line); }
.bar .grp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar label, .bar .lab { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); margin-right: 6px; }
.chip { padding: 9px 18px; border: 1px solid var(--line); border-radius: 30px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 500; transition: background .25s, color .25s, border-color .25s, transform .3s var(--ease); }
.chip:hover { border-color: var(--ink); transform: translateY(-2px); }
.chip[aria-pressed="true"] { background: var(--y); color: var(--k); border-color: var(--y); font-weight: 700; }
select { appearance: none; background: rgba(242, 235, 221, .08) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23f2b705' stroke-width='2'/></svg>") no-repeat right 14px center; color: var(--ink); border: 1px solid var(--line); border-radius: 30px; padding: 9px 38px 9px 18px; font: 500 12px var(--text); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
select option { background: #1b1916; color: var(--ink); }
.count { margin-left: auto; font-size: 12px; letter-spacing: .18em; color: var(--faint); text-transform: uppercase; font-variant-numeric: tabular-nums; }
.note { margin-top: 56px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); max-width: 640px; line-height: 1.9; }

/* ---- films: list ---- */
.row { display: grid; grid-template-columns: 70px 1fr 150px 90px 110px; align-items: center; gap: 12px; min-height: 96px; padding: 0 18px; border-top: 1px solid var(--line); transition: background .3s, color .3s, padding .4s var(--ease); }
.row:last-child { border-bottom: 1px solid var(--line); }
.row .n { font-size: 12px; letter-spacing: .2em; color: var(--y); font-variant-numeric: tabular-nums; }
.row .t { font-size: clamp(34px, 4.6vw, 70px); line-height: 1; }
.row .m { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.row:hover { background: var(--y); color: var(--k); padding-left: 34px; } .row:hover .n, .row:hover .m { color: var(--k); }
#float { position: fixed; z-index: 40; width: 380px; height: 250px; background-size: cover; background-position: center; border: 5px solid var(--y); pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(.85) rotate(-3deg); transition: opacity .2s, transform .25s var(--ease); left: 0; top: 0; }
#float.on { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(2deg); }
/* ---- films: strip ---- */
.strip { position: relative; display: flex; gap: 0; overflow-x: auto; padding: 56px 40px; margin-inline: -56px 0; background: #14120f; transform: rotate(-1.4deg); scrollbar-width: none; border-block: 1px solid var(--line); }
.strip::-webkit-scrollbar { display: none; }
.strip::before, .strip::after { content: ""; position: absolute; left: 0; width: 100%; min-width: max-content; height: 22px; background: repeating-linear-gradient(90deg, #0b0a09 0 22px, transparent 22px 50px); }
.strip::before { top: 16px; } .strip::after { bottom: 16px; }
.frame { position: relative; flex: none; width: 290px; margin-inline: 14px; transition: transform .4s var(--ease); }
.frame .im { height: 380px; background-size: cover; background-position: center; border: 3px solid #000; transition: outline-offset .3s; outline: 0 solid var(--y); }
.frame:hover { transform: translateY(-8px); } .frame:hover .im { outline: 4px solid var(--y); outline-offset: 4px; }
.frame b { position: absolute; left: 0; top: 0; background: #000; color: var(--y); font-size: 12px; letter-spacing: .14em; padding: 6px 10px; }
.frame .a { display: block; font-size: 34px; margin-top: 14px; line-height: 1; } .frame small { color: var(--dim); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
/* ---- film page ---- */
.back { display: inline-block; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); margin-bottom: 24px; transition: color .2s, transform .3s var(--ease); } .back:hover { color: var(--y); transform: translateX(-4px); }
.stage { position: relative; height: min(52vh, 560px); background: #000; overflow: hidden; border: 3px solid #000; }
.stage .im { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity .5s, transform 6s linear; } .stage .im.old { opacity: 0; }
.stage .grad { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0, 0, 0, .7), transparent 45%); }
.stage .play { position: absolute; left: 24px; bottom: 22px; display: flex; align-items: center; gap: 14px; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; }
.stage .play i { width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--y); display: grid; place-items: center; transition: background .25s; } .stage .play:hover i { background: var(--y); }
.stage .play i::after { content: ""; border-left: 15px solid var(--y); border-block: 9px solid transparent; margin-left: 4px; transition: border-color .25s; } .stage .play:hover i::after { border-left-color: var(--k); }
.stage .fc { position: absolute; right: 22px; bottom: 26px; font-size: 12px; letter-spacing: .2em; color: var(--y); font-variant-numeric: tabular-nums; }
.dstrip { position: relative; display: flex; gap: 12px; overflow-x: auto; padding: 44px 20px; margin-top: 22px; background: #14120f; scrollbar-width: none; }
.dstrip::-webkit-scrollbar { display: none; }
.dstrip::before, .dstrip::after { content: ""; position: absolute; left: 0; width: 100%; min-width: max-content; height: 16px; background: repeating-linear-gradient(90deg, #0b0a09 0 16px, transparent 16px 38px); } .dstrip::before { top: 12px; } .dstrip::after { bottom: 12px; }
.dstrip button { flex: none; width: 190px; height: 110px; background-size: cover; background-position: center; border: 3px solid #000; opacity: .6; transition: opacity .3s, transform .3s var(--ease); }
.dstrip button:hover { opacity: 1; transform: translateY(-4px); } .dstrip button[aria-current="true"] { opacity: 1; outline: 4px solid var(--y); outline-offset: 3px; }
.fd { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; margin-top: 36px; align-items: start; }
.fd h1 { font-size: clamp(60px, 8vw, 130px); line-height: .92; color: var(--y); }
.facts { display: grid; grid-template-columns: 110px 1fr; gap: 10px 14px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; } .facts b { color: var(--y); font-weight: 500; }
.pn { display: flex; justify-content: space-between; gap: 16px; margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line); flex-wrap: wrap; } .pn a { font-family: var(--display); font-size: 34px; transition: color .2s; } .pn a:hover { color: var(--y); }
/* ---- photography ---- */
.wall { columns: 4 230px; column-gap: 14px; }
.ph1 { position: relative; break-inside: avoid; margin-bottom: 14px; overflow: hidden; cursor: zoom-in; background: #000; }
.ph1 img { width: 100%; transition: transform .8s var(--ease), filter .4s; } .ph1:hover img { transform: scale(1.05); filter: brightness(.7); }
.ph1 figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 36px 14px 12px; background: linear-gradient(0deg, rgba(0, 0, 0, .85), transparent); transform: translateY(100%); transition: transform .4s var(--ease); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 10px; }
.ph1:hover figcaption { transform: none; } .tagdl { color: var(--y); font-weight: 700; white-space: nowrap; }
#lb { position: fixed; inset: 0; z-index: 80; background: rgba(6, 5, 4, .94); display: none; grid-template-columns: 1fr 340px; backdrop-filter: blur(10px); } #lb.on { display: grid; animation: fade .3s both; }
@keyframes fade { from { opacity: 0; } }
#lb .pic { position: relative; display: grid; place-items: center; padding: 30px; min-width: 0; } #lb img { max-height: calc(100vh - 80px); width: auto; max-width: 100%; object-fit: contain; }
#lb aside { padding: 40px 34px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; overflow-y: auto; } #lb h2 { font-size: 52px; line-height: 1; color: var(--y); }
#lb .x { position: absolute; right: 20px; top: 14px; z-index: 3; font-size: 34px; width: 46px; height: 46px; } #lb .nv { position: absolute; top: 50%; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); font-size: 22px; background: rgba(0, 0, 0, .4); } #lb .nv:hover { background: var(--y); color: var(--k); } #lb .prev { left: 16px; } #lb .next { right: 16px; }
/* ---- progress ---- */
.wips { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 22px; }
.wip { border: 1px solid var(--line); background: rgba(20, 18, 16, .7); display: flex; flex-direction: column; transition: transform .4s var(--ease), border-color .3s; } .wip:hover { transform: translateY(-6px); border-color: var(--y); }
.wip .im { height: 200px; background-size: cover; background-position: center; filter: saturate(.8); position: relative; } .wip .im span { position: absolute; left: 0; top: 14px; background: var(--y); color: var(--k); font-size: 11px; letter-spacing: .18em; font-weight: 700; text-transform: uppercase; padding: 6px 14px; }
.wip .bd { padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 14px; } .wip h3 { font-size: 44px; line-height: 1; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; } .steps i { display: block; height: 6px; background: rgba(242, 235, 221, .18); position: relative; overflow: hidden; } .steps i.done { background: var(--y); } .steps i.now::after { content: ""; position: absolute; inset: 0; background: var(--y); transform-origin: left; transform: scaleX(var(--p)); animation: grow 1.2s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }
.stl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); } .stl .now { color: var(--y); font-weight: 700; }
.wip .up { font-size: 13px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 12px; } .wip .up b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
/* ---- news ---- */
.feat { display: grid; grid-template-columns: 1.3fr 1fr; gap: 30px; margin-bottom: 34px; align-items: center; }
.feat .im { height: 380px; background-size: cover; background-position: center; border: 3px solid #000; transition: transform .6s var(--ease); } .feat:hover .im { transform: scale(1.02); }
.feat h2 { font-size: clamp(44px, 5.4vw, 86px); line-height: .98; margin: 10px 0 14px; }
.post { display: grid; grid-template-columns: 130px 1fr 140px; gap: 18px; align-items: center; padding: 22px 12px; border-top: 1px solid var(--line); transition: background .3s, padding .4s var(--ease); } .post:hover { background: rgba(242, 235, 221, .07); padding-left: 28px; }
.post time { font-size: 12px; letter-spacing: .18em; color: var(--y); text-transform: uppercase; font-variant-numeric: tabular-nums; } .post h3 { font-size: 34px; line-height: 1.05; } .post .tg { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); text-align: right; }
/* ---- hello ---- */
.hello { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: center; }
.hello h1 { font-size: clamp(110px, 17vw, 290px); line-height: .84; } .hello h1 i { font-style: normal; color: var(--y); }
.me { width: min(380px, 100%); aspect-ratio: 1; border-radius: 50%; border: 6px solid var(--y); background: url("images/silhouette.jpg") center/cover; justify-self: end; box-shadow: 14px 14px 0 rgba(242, 183, 5, .25); animation: float 7s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-12px) rotate(1.5deg); } }
.contact { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 36px; margin-top: 50px; padding-top: 26px; border-top: 3px solid var(--y); }
.contact .big { font-family: var(--display); font-size: clamp(34px, 4vw, 60px); line-height: 1.05; word-break: break-word; } .contact b { display: block; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--y); margin-bottom: 12px; font-weight: 700; } .contact p { color: var(--dim); }
.copy { margin-top: 16px; }
/* ---- player + toast + menu ---- */
#pl { position: fixed; inset: 0; z-index: 85; background: rgba(6, 5, 4, .95); display: none; place-items: center; padding: 30px; } #pl.on { display: grid; animation: fade .3s both; }
#pl .box { width: min(1100px, 100%); aspect-ratio: 16/9; position: relative; background-size: cover; background-position: center; border: 3px solid var(--y); display: grid; place-items: center; text-align: center; } #pl .box::before { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, .6); } #pl .box div { position: relative; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; max-width: 80%; line-height: 2; } #pl .box .a { font-size: clamp(36px, 6vw, 80px); color: var(--y); display: block; line-height: 1; margin-bottom: 12px; }
#pl .x { position: absolute; right: 22px; top: 16px; font-size: 38px; }
#toast { position: fixed; z-index: 90; left: 50%; bottom: 34px; transform: translate(-50%, 30px); background: var(--y); color: var(--k); font-weight: 700; font-size: 13px; letter-spacing: .1em; padding: 14px 26px; border-radius: 40px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .4s var(--ease); } #toast.on { opacity: 1; transform: translate(-50%, 0); }
#mm { display: none; }
@media (max-width: 900px) {
  :root { --rail: 0px; }
  #rail { flex-direction: row; align-items: center; height: 64px; bottom: auto; width: 100%; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(11, 10, 9, .85), transparent); }
  #nav, .rail-foot { display: none; }

  function wall() {
    shown = PHOTOS.filter(function (p) { return (ps.coll === "All" || (ps.coll === "Free to download" ? p.dl : p.coll === ps.coll)) && (ps.proj === "all" || p.project === ps.proj); });
    shown.sort(function (a, b) { return ps.sort === "az" ? a.title.localeCompare(b.title) : ps.sort === "old" ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date); });
    $("#pcount").textContent = shown.length + " photos";
    $("#wall").innerHTML = shown.map(function (p, i) { return '<figure class="ph1 rise" style="--d:' + Math.min(i, 14) * 45 + 'ms" data-i="' + i + '"><img src="' + IMG(p.k) + '" alt="' + p.title + '" loading="lazy"><figcaption><span>' + p.title + "</span>" + (p.dl ? '<span class="tagdl">FREE</span>' : "") + "</figcaption></figure>"; }).join("");
    $$(".ph1").forEach(function (f) { f.onclick = function () { openLb(+f.dataset.i); }; });
  }
  function openLb(i) {
    cur = (i + shown.length) % shown.length; var p = shown[cur], lb = $("#lb");
    lb.innerHTML = '<div class="pic"><button class="x" aria-label="Close">&#10005;</button><button class="nv prev" aria-label="Previous">&#8592;</button><img src="' + IMG(p.k) + '" alt="' + p.title + '"><button class="nv next" aria-label="Next">&#8594;</button></div>' +
      '<aside><span class="cap" style="color:var(--y)">' + p.coll + " &middot; " + p.project + '</span><h2 class="a">' + p.title.toUpperCase() + '</h2><p style="color:var(--dim)">' + fmtDate(p.date) + " &middot; " + (cur + 1) + " of " + shown.length + "</p>" +
      (p.dl ? '<a class="btn y" id="dl" href="' + IMG(p.k) + '" download="astris-' + p.k + '.jpg">Download photo</a><p style="color:var(--dim);font-size:13px">Free to download. A credit is appreciated.</p>' : '<p class="cap" style="color:var(--faint)">Not available to download</p>') + "</aside>";
    lb.classList.add("on");
    var d = $("#dl"); if (d) d.onclick = function () { toast("Downloading " + p.title); };
  }
  $("#lb").addEventListener("click", function (e) { if (e.target.closest(".x") || e.target === this) this.classList.remove("on"); else if (e.target.closest(".prev")) openLb(cur - 1); else if (e.target.closest(".next")) openLb(cur + 1); });
  $("#pl").addEventListener("click", function (e) { if (e.target.closest(".x") || e.target === this) this.classList.remove("on"); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { $("#lb").classList.remove("on"); $("#pl").classList.remove("on"); document.body.classList.remove("menu"); }
    if ($("#lb").classList.contains("on")) { if (e.key === "ArrowRight") openLb(cur + 1); if (e.key === "ArrowLeft") openLb(cur - 1); }
    else if (dstate.f && /^film-/.test(route()) && !$("#pl").classList.contains("on")) { if (e.key === "ArrowRight") frame(dstate.i + 1); if (e.key === "ArrowLeft") frame(dstate.i - 1); }
  });

  var ws = { kind: "All", sort: "far" };
  P.progress = function () {
    $("#view").innerHTML = head("IN PROGRESS", ".", "What is being made right now, and how far along it is. Updated as things move.") +
      '<div class="bar rise" style="--d:100ms"><div class="grp"><span class="lab">Show</span>' + chips("kind", ["All", "Film", "Photography"], ws.kind) + '</div><div class="grp"><label for="wsort">Sort</label>' + select("wsort", [["far", "Furthest along"], ["new", "Latest update"], ["az", "A to Z"]], ws.sort) + '</div><span class="count" id="wcount"></span></div><div class="wips" id="wips"></div>' + SAMPLE;
    $("#wsort").onchange = function () { ws.sort = this.value; wips(); }; bindChips($("#view"), ws, wips); wips();
  };
  function wips() {
    var l = WIPS.filter(function (w) { return ws.kind === "All" || w.kind === ws.kind; });
    l.sort(function (a, b) { return ws.sort === "az" ? a.title.localeCompare(b.title) : ws.sort === "new" ? b.up[0].localeCompare(a.up[0]) : (b.stage + b.p) - (a.stage + a.p); });
    $("#wcount").textContent = l.length + " projects";
    $("#wips").innerHTML = l.map(function (w, i) {
      var steps = STAGES.map(function (s, x) { return "<i" + (x < w.stage ? ' class="done"' : x === w.stage ? ' class="now" style="--p:' + w.p + '"' : "") + "></i>"; }).join("");
      var lab = STAGES.map(function (s, x) { return "<span" + (x === w.stage ? ' class="now"' : "") + ">" + s + "</span>"; }).join("");
      return '<article class="wip rise" style="--d:' + i * 90 + 'ms"><div class="im" style="' + bg(w.still) + '"><span>' + w.kind + '</span></div><div class="bd"><h3 class="a">' + w.title.toUpperCase() + '</h3><div><div class="steps">' + steps + '</div><div class="stl" style="margin-top:8px">' + lab + '</div></div><p class="up"><b>' + fmtDate(w.up[0]) + "</b> &nbsp; " + w.up[1] + "</p></div></article>";
    }).join("");
  }
  var ns = { tag: "All", sort: "new" };
  P.news = function () {
    $("#view").innerHTML = head("NEWS", ".", "Releases, behind the scenes, and what the studio is up to.") +
      '<div class="bar rise" style="--d:100ms"><div class="grp"><span class="lab">Topic</span>' + chips("tag", ["All", "Films", "Photography", "Behind the scenes", "Studio"], ns.tag) + '</div><div class="grp"><label for="nsort">Sort</label>' + select("nsort", [["new", "Newest first"], ["old", "Oldest first"]], ns.sort) + '</div><span class="count" id="ncount"></span></div><div id="nout"></div>' + SAMPLE;
    $("#nsort").onchange = function () { ns.sort = this.value; news(); }; bindChips($("#view"), ns, news); news();
  };
  function news() {
    var l = NEWS.filter(function (n) { return ns.tag === "All" || n.tag === ns.tag; }); l.sort(function (a, b) { return ns.sort === "new" ? b.d.localeCompare(a.d) : a.d.localeCompare(b.d); });
    $("#ncount").textContent = l.length + " posts"; if (!l.length) { $("#nout").innerHTML = '<p class="note">No posts under this topic yet.</p>'; return; }
    var f = l[0];
    $("#nout").innerHTML = '<a class="feat rise" href="#news"><div class="im" style="' + bg(f.k) + '"></div><div><span class="cap" style="color:var(--y)">' + f.tag + " &middot; " + fmtDate(f.d) + '</span><h2 class="a">' + f.t + '</h2><p style="color:var(--dim)">[THE FIRST LINES OF THE POST GO HERE, SO PEOPLE KNOW WHAT IT IS ABOUT BEFORE THEY CLICK.]</p></div></a>' +
      l.slice(1).map(function (n, i) { return '<a class="post rise" style="--d:' + i * 70 + 'ms" href="#news"><time>' + fmtDate(n.d) + '</time><h3 class="a">' + n.t + '</h3><span class="tg">' + n.tag + "</span></a>"; }).join("");
  }
  P.hello = function () {
    $("#view").innerHTML = '<div class="hello"><h1 class="a rise">SAY<br>HELLO<i>.</i></h1><div class="me rise" style="--d:150ms" role="img" aria-label="Silhouette of a person holding a camera"></div></div>' +
      '<div class="contact rise" style="--d:250ms"><div><b>Email</b><div class="big" id="em">[EMAIL ADDRESS]</div><button class="btn o copy" id="cp">Copy email</button></div><div><b>About</b><p>[TWO OR THREE FRIENDLY SENTENCES ABOUT YOU AND WHAT YOU MAKE.]</p></div><div><b>Follow</b><p>YouTube [@HANDLE]<br>Instagram [@HANDLE]<br>Letterboxd [NAME]</p></div></div>' + SAMPLE;
    $("#cp").onclick = function () { var t = $("#em").textContent, ok = function () { toast("Email copied"); }; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function () { sel(); toast("Press Ctrl+C to copy"); }); else { sel(); toast("Press Ctrl+C to copy"); } function sel() { var r = document.createRange(); r.selectNodeContents($("#em")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } };
  };

  /* ---------- routing: plain #names; a yellow strip wipes across between pages ---------- */
  function route() { return (location.hash || "#home").slice(1); }
  var first = true, last = "";
  function show() {
    var r = route(), page = /^film-/.test(r) ? "film" : (P[r] ? r : "home"), key = r;
    $("#lb").classList.remove("on"); $("#pl").classList.remove("on"); fl.classList.remove("on");
    var run = function () {
      document.body.dataset.page = page === "film" ? "films" : page; $("#view").scrollTop = 0;
      $$("#nav a").forEach(function (a) { a.setAttribute("aria-current", a.dataset.r === (page === "film" ? "films" : page) ? "page" : "false"); });
      if (page === "film") P.film(r.slice(5)); else P[page]();
    };
    if (first || key === last) { first = false; run(); } else { var t = $("#tape"); t.classList.remove("go"); void t.offsetWidth; t.classList.add("go"); setTimeout(run, 380); }
    last = key;
  }
  window.addEventListener("hashchange", show); show();
})();
</script>
