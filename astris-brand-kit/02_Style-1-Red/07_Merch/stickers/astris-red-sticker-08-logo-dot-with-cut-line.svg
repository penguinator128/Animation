<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="30.99mm" height="30.99mm" viewBox="-15.494 -15.494 30.988 30.988">
  <title>ASTRIS sticker 08-logo-dot, Red style: 25 x 25 mm, 2 mm bleed</title>
