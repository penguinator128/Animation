    <image x="-27.982" y="-27.982" width="55.965" height="55.965" xlink:href="astris-yellow-sticker-03-circle-dark-logo.png" href="astris-yellow-sticker-03-circle-dark-logo.png"/>
  </g>
  <g id="cut-line" fill="none" stroke="#FF00FF" stroke-width="0.1">
    <circle cx="0" cy="0" r="25.000"/>
  </g>
</svg>
