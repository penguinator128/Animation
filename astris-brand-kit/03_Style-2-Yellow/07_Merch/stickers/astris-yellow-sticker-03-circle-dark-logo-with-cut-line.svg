<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="55.96mm" height="55.96mm" viewBox="-27.982 -27.982 55.965 55.965">
  <title>ASTRIS sticker 03-circle-dark-logo, Yellow style: 50 x 50 mm, 2 mm bleed</title>
  <!-- Units are millimetres. Layer 1 is the artwork (300 dpi, with 2 mm of bleed). Layer 2 is the cut line:
