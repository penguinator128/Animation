<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="96.01mm" height="55.96mm" viewBox="-48.006 -27.982 96.012 55.965">
  <title>ASTRIS sticker 04-rounded-lockup, Yellow style: 90 x 50 mm, 2 mm bleed</title>
  <!-- Units are millimetres. Layer 1 is the artwork (300 dpi, with 2 mm of bleed). Layer 2 is the cut line:
       a vector hairline in magenta. Most print shops call this layer "CutContour"; rename it if yours asks. -->
  <g id="artwork">
    <image x="-48.006" y="-27.982" width="96.012" height="55.965" xlink:href="astris-yellow-sticker-04-rounded-lockup.png" href="astris-yellow-sticker-04-rounded-lockup.png"/>
  </g>
  <g id="cut-line" fill="none" stroke="#FF00FF" stroke-width="0.1">
    <rect x="-45.000" y="-25.000" width="90.000" height="50.000" rx="6.000"/>
  </g>
</svg>
